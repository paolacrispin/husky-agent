[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# Required by HuskyAgentRouter.swapExactTokensForTokens: too many locals for
# legacy codegen to fit on the EVM stack ("stack too deep").
via_ir = true

[rpc_endpoints]
hsk_testnet = "${HSK_TESTNET_RPC_URL}"

[etherscan]
hsk_testnet = { key = "${HSK_TESTNET_EXPLORER_API_KEY}", url = "${HSK_TESTNET_EXPLORER_URL}/api" }
